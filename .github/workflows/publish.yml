name: Publish Printer Demon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printer-demon-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Read and validate project version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild PrinterDemon.csproj -nologo -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Expected a four-part Version in PrinterDemon.csproj; got '$version'."
          }
          $projectVersion = [System.Version]::Parse($version)
          $latestTag = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } |
            Select-Object -First 1

          if ($latestTag) {
            $latestVersion = [System.Version]::Parse($latestTag.Substring(1))
            if ($projectVersion -lt $latestVersion) {
              throw "Project version $version is older than release $latestTag. Bump Version in PrinterDemon.csproj."
            }
            if ($projectVersion -eq $latestVersion) {
              $tagCommit = git rev-list -n 1 $latestTag
              $headCommit = git rev-parse HEAD
              if ($tagCommit -ne $headCommit) {
                throw "Release $latestTag already belongs to another commit. Bump Version in PrinterDemon.csproj."
              }
            }
          }

          Write-Host "Latest release tag: $latestTag"
          Write-Host "Project and release version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish
        run: dotnet publish PrinterDemon.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true

      - name: Prepare update files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "publish/PrinterDemon.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/PrinterDemon.exe"
          @{ version = $version; url = $url; sha256 = $hash; notes = "" } | ConvertTo-Json | Set-Content publish/latest.json

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\PrinterDemon.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Printer Demon ${{ steps.version.outputs.version }}
          generate_release_notes: false
          files: |
            publish/PrinterDemon.exe
            publish/latest.json
            artifacts/PrinterDemon-Setup-*.exe
